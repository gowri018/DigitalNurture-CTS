<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Colors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Dashboard Page</h4>

<div class="container mt-3">

    <div class="bg-primary text-white p-3 mb-3">
        Total Users: 1200
    </div>

    <div class="bg-success text-white p-3 mb-3">
        Active Users: 950
    </div>

    <div class="bg-warning text-dark p-3 mb-3">
        Pending Requests: 45
    </div>

    <div class="bg-danger text-white p-3">
        Failed Transactions: 10
    </div>

</div>

<h4 class="mt-4">Gradient Background</h4>

<div class="container">
    <div class="bg-dark bg-gradient text-white p-5 text-center">
        Welcome to the Dashboard
    </div>
</div>

</body>
</html>
